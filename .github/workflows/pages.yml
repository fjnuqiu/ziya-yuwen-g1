name: Publish Ziya account website
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ziya-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ZIYA_SUPABASE_URL: ${{ vars.VITE_ZIYA_SUPABASE_URL }}
          VITE_ZIYA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_ZIYA_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
